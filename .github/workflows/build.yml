name: Build unsigned package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  pkg:
    name: macOS unsigned pkg
    # macos-latest is the arm64 pool, which is currently cancelling jobs
    # before a runner is assigned. macos-15-intel is a separate pool.
    # ARCHS makes the app universal from that Intel machine.
    runs-on: macos-15-intel
    env:
      ARCHS: arm64 x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Tag v0.1.0 sets MARKETING_VERSION=0.1.0. make passes that to
      # xcodebuild, which writes CFBundleShortVersionString. The same
      # value is the package version. Pull requests and main keep 0.1.0
      # from the Xcode project.
      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must look like v0.1.0: a v plus two to four numeric components." >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build package
        run: ./action-build.sh package

      - name: Stage unsigned package
        shell: bash
        run: |
          test -f package/Paretly.pkg
          mkdir -p dist
          cp package/Paretly.pkg dist/Paretly-unsigned.pkg

      - name: Check the package
        shell: bash
        run: |
          test -f dist/Paretly-unsigned.pkg
          ls -lh dist/Paretly-unsigned.pkg package/Paretly.pkg
          stat -f 'bytes=%z' dist/Paretly-unsigned.pkg
          plist="build/Build/Products/Release/Paretly.app/Contents/Info.plist"
          test -f "${plist}"
          short="$(plutil -extract CFBundleShortVersionString raw -o - "${plist}")"
          bundle="$(plutil -extract CFBundleVersion raw -o - "${plist}")"
          echo "CFBundleShortVersionString=${short}"
          echo "CFBundleVersion=${bundle}"
          test -n "${short}"
          test "${short}" != '$(MARKETING_VERSION)'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "${short}" = "${GITHUB_REF_NAME#v}"
            test "${bundle}" = "${GITHUB_REF_NAME#v}"
          else
            test "${short}" = "0.1.0"
            test "${bundle}" = "0.1.0"
          fi

      # iconutil expands AppIcon.icns and sips prints each PNG's pixel size.
      # ic14 must be 512x512 (256 pt @2x). A 16px image in that slot is what
      # made Launchpad show a blurred icon.
      - name: Check app icon sizes
        shell: bash
        run: python3 tools/inspect-icns.py "build/Build/Products/Release/Paretly.app"

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: Paretly-unsigned.pkg
          path: dist/Paretly-unsigned.pkg
          if-no-files-found: error
          retention-days: 14

  # Same package job as above. This job only runs for a v* tag push.
  release:
    name: Publish GitHub Release
    needs: pkg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: Paretly-unsigned.pkg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="$(find dist -type f -name 'Paretly-unsigned.pkg' -print -quit)"
          test -n "${pkg}"
          ls -lh "${pkg}"
          # Published next to the package so the app can verify the download.
          sha256sum "${pkg}" > "${pkg}.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            "${pkg}" \
            "${pkg}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
