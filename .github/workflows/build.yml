name: Build unsigned disk image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  dmg:
    name: macOS unsigned pkg and dmg
    # macos-latest is the arm64 pool, which is currently cancelling jobs
    # before a runner is assigned. macos-15-intel is a separate pool.
    # ARCHS makes the app universal from that Intel machine.
    runs-on: macos-15-intel
    env:
      ARCHS: arm64 x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Tag v0.1.0 sets MARKETING_VERSION=0.1.0. make passes that to
      # xcodebuild, which writes CFBundleShortVersionString. The same
      # value is the package version. Pull requests and main keep 0.1.0
      # from the Xcode project.
      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must look like v0.1.0: a v plus two to four numeric components." >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build package and disk image
        run: ./action-build.sh dmg

      - name: Check the disk image
        shell: bash
        run: |
          test -f dist/Paretly-unsigned.dmg
          ls -lh dist/Paretly-unsigned.dmg package/Paretly.pkg
          plist="build/Build/Products/Release/Paretly.app/Contents/Info.plist"
          test -f "${plist}"
          short="$(plutil -extract CFBundleShortVersionString raw -o - "${plist}")"
          bundle="$(plutil -extract CFBundleVersion raw -o - "${plist}")"
          echo "CFBundleShortVersionString=${short}"
          echo "CFBundleVersion=${bundle}"
          test -n "${short}"
          test "${short}" != '$(MARKETING_VERSION)'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "${short}" = "${GITHUB_REF_NAME#v}"
            test "${bundle}" = "${GITHUB_REF_NAME#v}"
          else
            test "${short}" = "0.1.0"
            test "${bundle}" = "0.1.0"
          fi

      - name: Upload unsigned disk image
        uses: actions/upload-artifact@v4
        with:
          name: Paretly-unsigned.dmg
          path: dist/Paretly-unsigned.dmg
          if-no-files-found: error
          retention-days: 14

  # Same dmg job as above. This job only runs for a v* tag push.
  release:
    name: Publish GitHub Release
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned disk image
        uses: actions/download-artifact@v4
        with:
          name: Paretly-unsigned.dmg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg="$(find dist -type f -name 'Paretly-unsigned.dmg' -print -quit)"
          test -n "${dmg}"
          ls -lh "${dmg}"
          # Published next to the disk image so the app can verify the download.
          sha256sum "${dmg}" > "${dmg}.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            "${dmg}" \
            "${dmg}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
