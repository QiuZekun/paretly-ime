name: Build unsigned package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  pkg:
    name: macOS unsigned pkg
    outputs:
      short_version: ${{ steps.check.outputs.short_version }}
      channel: ${{ steps.check.outputs.channel }}
    # macos-latest is the arm64 pool, which is currently cancelling jobs
    # before a runner is assigned. macos-15-intel is a separate pool.
    # ARCHS makes the app universal from that Intel machine.
    runs-on: macos-15-intel
    env:
      ARCHS: arm64 x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Every CI build gets a higher CFBundleVersion and package version so
      # installing over an existing copy replaces it. A v* tag still sets
      # CFBundleShortVersionString. Main builds are the beta channel.
      - name: Set the monotonic build number
        shell: bash
        run: |
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "PARETLY_UPDATE_CHANNEL=beta" >> "${GITHUB_ENV}"
          fi

      - name: Set app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must look like v0.1.0: a v plus two to four numeric components." >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build package
        run: ./action-build.sh package

      - name: Stage unsigned package
        shell: bash
        run: |
          test -f package/Paretly.pkg
          mkdir -p dist
          cp package/Paretly.pkg dist/Paretly-unsigned.pkg

      - name: Check the package
        id: check
        shell: bash
        run: |
          test -f dist/Paretly-unsigned.pkg
          ls -lh dist/Paretly-unsigned.pkg package/Paretly.pkg
          stat -f 'bytes=%z' dist/Paretly-unsigned.pkg
          plist="build/Build/Products/Release/Paretly.app/Contents/Info.plist"
          test -f "${plist}"
          short="$(plutil -extract CFBundleShortVersionString raw -o - "${plist}")"
          bundle="$(plutil -extract CFBundleVersion raw -o - "${plist}")"
          channel="$(plutil -extract ParetlyUpdateChannel raw -o - "${plist}")"
          echo "CFBundleShortVersionString=${short}"
          echo "CFBundleVersion=${bundle}"
          echo "ParetlyUpdateChannel=${channel}"
          echo "short_version=${short}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          test -n "${short}"
          test "${short}" != '$(MARKETING_VERSION)'
          test "${bundle}" = "${GITHUB_RUN_NUMBER}"
          test "${channel}" != '$(PARETLY_UPDATE_CHANNEL)'
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            test "${channel}" = "beta"
          else
            test "${channel}" = "stable"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "${short}" = "${GITHUB_REF_NAME#v}"
          else
            test "${short}" = "0.1.0"
          fi
          expanded="$(mktemp -d)"
          pkgutil --expand dist/Paretly-unsigned.pkg "${expanded}/pkg"
          grep -q "version=\"${GITHUB_RUN_NUMBER}\"" "${expanded}/pkg/PackageInfo"
          grep -q 'postinstall-action="none"' "${expanded}/pkg/PackageInfo"
          test -x "${expanded}/pkg/Scripts/preinstall"
          test -x "${expanded}/pkg/Scripts/postinstall"
          grep -q killall "${expanded}/pkg/Scripts/preinstall"
          grep -q -- '--register-input-source' "${expanded}/pkg/Scripts/postinstall"
          rm -rf "${expanded}"

      # iconutil expands AppIcon.icns and sips prints each PNG's pixel size.
      # ic14 must be 512x512 (256 pt @2x). A 16px image in that slot is what
      # made Launchpad show a blurred icon.
      - name: Check app icon sizes
        shell: bash
        run: python3 tools/inspect-icns.py "build/Build/Products/Release/Paretly.app"

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: Paretly-unsigned.pkg
          path: dist/Paretly-unsigned.pkg
          if-no-files-found: error
          retention-days: 14

  # Same package job as above. This job only runs for a v* tag push.
  release:
    name: Publish GitHub Release
    needs: pkg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: Paretly-unsigned.pkg
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="$(find dist -type f -name 'Paretly-unsigned.pkg' -print -quit)"
          test -n "${pkg}"
          ls -lh "${pkg}"
          # Published next to the package so the app can verify the download.
          sha256sum "${pkg}" > "${pkg}.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            "${pkg}" \
            "${pkg}.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            --latest=true

  # Main pushes only. Pull requests and v* tags do not publish a beta.
  beta:
    name: Publish beta prerelease
    needs: pkg
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: Paretly-unsigned.pkg
          path: dist

      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_VERSION: ${{ needs.pkg.outputs.short_version }}
          CHANNEL: ${{ needs.pkg.outputs.channel }}
        run: |
          test "${CHANNEL}" = "beta"
          test -n "${SHORT_VERSION}"
          pkg="$(find dist -type f -name 'Paretly-unsigned.pkg' -print -quit)"
          test -n "${pkg}"
          ls -lh "${pkg}"
          sha256sum "${pkg}" > "${pkg}.sha256"
          tag="beta-${GITHUB_RUN_NUMBER}"
          title="${SHORT_VERSION}-beta.${GITHUB_RUN_NUMBER}"
          if [[ ! "${title}" =~ ^[0-9]+(\.[0-9]+){1,3}-beta\.[0-9]+$ ]]; then
            echo "Beta title ${title} must look like 0.1.0-beta.123." >&2
            exit 1
          fi
          if [[ "${tag}" == v* ]]; then
            echo "Beta tags must not look like stable v* tags." >&2
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes --cleanup-tag
          fi
          gh release create "${tag}" \
            "${pkg}" \
            "${pkg}.sha256" \
            --prerelease \
            --latest=false \
            --title "${title}" \
            --target "${GITHUB_SHA}" \
            --notes "Beta ${title}. This is not a stable release. The package upgrades an existing Paretly install in place."

      - name: Prune old betas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep=5
          mapfile -t numbers < <(
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName | select(test("^beta-[0-9]+$")) | sub("^beta-"; "")'
          )
          if ((${#numbers[@]} <= keep)); then
            echo "Keeping ${#numbers[@]} beta release(s)."
            exit 0
          fi
          mapfile -t stale < <(printf '%s\n' "${numbers[@]}" | sort -n | head -n "-${keep}")
          for number in "${stale[@]}"; do
            echo "Deleting beta-${number}"
            gh release delete "beta-${number}" --yes --cleanup-tag
          done

